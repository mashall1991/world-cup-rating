<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>世界杯队伍实力评估</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">World Cup Competitive Strength</p>
          <h1>世界杯队伍实力评估</h1>
        </div>
        <nav class="app-nav" aria-label="页面切换">
          <button id="strengthNav" class="nav-button active" type="button">实力</button>
          <button id="scheduleNav" class="nav-button" type="button">赛程</button>
        </nav>
      </header>

      <section id="strengthControls" class="controls" aria-label="筛选与排序">
        <label class="search-box" for="teamSearch">
          <span aria-hidden="true">⌕</span>
          <input id="teamSearch" type="search" placeholder="搜索队伍、球员、俱乐部" autocomplete="off" />
        </label>
        <label class="select-box" for="sortMode">
          <span>排序</span>
          <select id="sortMode">
            <option value="rank">综合排名</option>
            <option value="squadQuality">阵容质量</option>
            <option value="recentMatchRating">近期比赛</option>
            <option value="positionalBalance">位置平衡</option>
            <option value="squadDepth">阵容深度</option>
            <option value="cohesionContinuity">协同连续性</option>
            <option value="ageLoad">年龄耐久</option>
          </select>
        </label>
      </section>

      <main id="strengthView" class="workspace app-view active">
        <div id="liveBanner" class="live-banner" hidden aria-live="polite"></div>
        <aside class="team-panel" aria-label="队伍列表">
          <div class="panel-heading">
            <h2>队伍</h2>
            <span id="teamCount">0</span>
          </div>
          <div id="teamList" class="team-list"></div>
        </aside>

        <section id="detailPanel" class="detail-panel" aria-live="polite">
          <button id="sheetHandle" class="sheet-handle" type="button" aria-label="拖动或点击展开/收起评分详情">
            <span></span>
          </button>
          <div class="score-band">
            <div class="team-identity">
              <div id="teamBadge" class="team-badge">--</div>
              <div>
                <p id="teamConfed" class="eyebrow">--</p>
                <h2 id="teamName">--</h2>
                <p id="teamMeta" class="muted">--</p>
              </div>
            </div>
            <div class="score-block">
              <span id="teamRank" class="rank-pill">#--</span>
              <strong id="finalScore">--</strong>
              <span id="strengthTier">--</span>
            </div>
          </div>

          <section class="summary-grid" aria-label="评分摘要">
            <div class="metric-tile">
              <span>基础评分</span>
              <strong id="baseScore">--</strong>
            </div>
            <div class="metric-tile">
              <span>位置平衡</span>
              <strong id="balanceAdjustment">--</strong>
            </div>
            <div class="metric-tile">
              <span>可用性系数</span>
              <strong id="availabilityAdjustment">--</strong>
            </div>
            <div class="metric-tile">
              <span>名单版本</span>
              <button id="squadVersion" class="link-metric" type="button">--</button>
            </div>
          </section>

          <section class="chart-section" aria-label="评分模型">
            <div class="section-heading">
              <h3>评分模型</h3>
              <span id="coefficientTotal">系数合计 100%</span>
            </div>
            <div id="dimensionBars" class="dimension-bars"></div>
            <div class="coefficient-panel" aria-label="模型系数设置">
              <label class="stage-load-row" for="stageLoadMode">
                <span>赛程阶段</span>
                <select id="stageLoadMode">
                  <option value="group">小组赛</option>
                  <option value="round32">32强</option>
                  <option value="round16">16强</option>
                  <option value="quarterfinal">八强</option>
                  <option value="semifinal">四强</option>
                  <option value="final">决赛</option>
                </select>
                <small id="stageLoadHint">年龄有效 3%</small>
              </label>
              <div id="coefficientControls" class="coefficient-controls"></div>
              <button id="resetCoefficients" class="ghost-button" type="button">重置默认系数</button>
            </div>
          </section>

          <section class="split-section">
            <div class="data-section">
              <div class="section-heading">
                <h3>竞技环境</h3>
                <span>来源指标</span>
              </div>
              <div id="environmentBreakdown" class="breakdown-list"></div>
            </div>

            <div class="data-section">
              <div class="section-heading">
                <h3>近期表现</h3>
                <span id="performanceSource">24个月</span>
              </div>
              <div id="performanceBreakdown" class="breakdown-list"></div>
            </div>
          </section>

          <section class="split-section">
            <div class="data-section">
              <div class="section-heading">
                <h3>年龄结构</h3>
                <span id="ageNote">--</span>
              </div>
              <div id="ageProfile" class="age-profile"></div>
            </div>

            <div class="data-section">
              <div class="section-heading">
                <h3>协同经验</h3>
                <span>球员组合</span>
              </div>
              <div id="cohesionBreakdown" class="breakdown-list"></div>
            </div>
          </section>

          <section class="squad-section" aria-label="关键球员">
            <div class="section-heading">
              <h3>关键球员</h3>
              <span id="playerCount">0</span>
            </div>
            <div id="playerTable" class="player-table"></div>
          </section>
        </section>
      </main>

      <section id="scheduleView" class="schedule-view app-view" aria-label="赛程页">
        <section class="schedule-hero">
          <div>
            <p class="eyebrow">Matches</p>
            <h2>赛程与近期比赛</h2>
          </div>
          <div class="schedule-status">
            <span>数据更新 · 全部时间为北京时间 (UTC+8)</span>
            <strong id="scheduleUpdated">--</strong>
          </div>
        </section>

        <section class="schedule-controls" aria-label="赛程筛选">
          <div class="segmented-control" role="tablist" aria-label="赛程类型">
            <button id="recentScheduleMode" class="active" type="button">近期比赛</button>
            <button id="fullScheduleMode" type="button">完整赛程</button>
          </div>
          <label class="search-box" for="scheduleSearch">
            <span aria-hidden="true">⌕</span>
            <input id="scheduleSearch" type="search" placeholder="搜索球队、赛事、城市" autocomplete="off" />
          </label>
          <label class="select-box" for="scheduleGroup">
            <span>小组</span>
            <select id="scheduleGroup">
              <option value="all">全部</option>
            </select>
          </label>
        </section>

        <section class="schedule-panel">
          <div class="section-heading">
            <h3 id="scheduleTitle">近期比赛</h3>
            <span id="scheduleCount">0</span>
          </div>
          <div id="scheduleList" class="schedule-list"></div>
        </section>
      </section>
    </div>

    <template id="teamButtonTemplate">
      <button class="team-button" type="button">
        <span class="mini-badge"></span>
        <span class="team-copy">
          <strong></strong>
          <small></small>
        </span>
        <span class="team-score"></span>
      </button>
    </template>

    <dialog id="lineupDialog" class="lineup-dialog" aria-labelledby="lineupTitle">
      <div class="dialog-head">
        <div>
          <p id="lineupMeta" class="eyebrow">--</p>
          <h2 id="lineupTitle">--</h2>
        </div>
        <button id="closeLineup" class="icon-button" type="button" aria-label="关闭预测首发">×</button>
      </div>
      <div id="lineupGrid" class="lineup-grid"></div>
    </dialog>

    <dialog id="compareDialog" class="lineup-dialog" aria-labelledby="compareTitle">
      <div class="dialog-head">
        <div>
          <p id="compareMeta" class="eyebrow">--</p>
          <h2 id="compareTitle">--</h2>
        </div>
        <button id="closeCompare" class="icon-button" type="button" aria-label="关闭对比">×</button>
      </div>
      <div id="compareBody" class="compare-body"></div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous" defer></script>
    <script src="./data/public/public_data.js" defer></script>
    <script src="./data/public/squad_model_data.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
