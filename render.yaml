services:
  - type: web
    name: worldcup-strength
    runtime: node
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_LEAGUE
        value: "1"
      - key: API_FOOTBALL_SEASON
        value: "2026"
      - key: API_FOOTBALL_TIMEZONE
        value: Asia/Shanghai
