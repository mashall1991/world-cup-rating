services:
  - type: web
    name: worldcup-strength
    runtime: node
    plan: starter
    # 用户主要在亚洲(Asia/Shanghai)，选新加坡区域比默认美西(Oregon)延迟低得多
    region: singapore
    # npm ci 会先整体删掉 node_modules 再装,避免缓存里损坏的依赖残留
    buildCommand: "npm ci && npm run build"
    startCommand: node server.js
    healthCheckPath: /
    disk:
      name: villain-heat-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_LEAGUE
        value: "1"
      - key: API_FOOTBALL_SEASON
        value: "2026"
      - key: API_FOOTBALL_TIMEZONE
        value: Asia/Shanghai
      # 旧 JSON 仅用于首次迁移；热度现以 SQLite 持久化在同一块磁盘上
      - key: VILLAIN_HEAT_FILE
        value: /var/data/villain_heat.json
      - key: VILLAIN_HEAT_DB
        value: /var/data/villain_heat.db
